[workspace]
resolver = "2"
members = [
    "crates/xmlspy-core",
    "crates/xmlspy-index",
    "crates/xmlspy-parse",
    "crates/xmlspy-wasm",
    "crates/xmlspy-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debanaik1407/XMLSpy"
authors = ["XMLSpy-rs contributors"]

[workspace.dependencies]
xmlspy-core = { path = "crates/xmlspy-core" }
xmlspy-index = { path = "crates/xmlspy-index" }
xmlspy-parse = { path = "crates/xmlspy-parse" }

# Native release: fast.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# WASM release: small. Built with `--profile wasm`.
[profile.wasm]
inherits = "release"
opt-level = 2
panic = "abort"
debug = false
overflow-checks = false
